<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>TrendRadar AI</title>
<style>
:root{--bg:#0b1020;--panel:#141c31;--muted:#9eacc8;--text:#f4f7ff;--accent:#7c9cff;--line:#263451}
*{box-sizing:border-box}body{margin:0;background:linear-gradient(135deg,#0b1020,#111a30);color:var(--text);font:15px system-ui,Arial}
header{padding:22px max(18px,calc((100% - 1100px)/2));border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
h1{margin:0;font-size:24px}header p{margin:4px 0 0;color:var(--muted)}main{max-width:1100px;margin:24px auto;padding:0 16px}
.toolbar,.card,.notice{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
select,button,input{border:1px solid var(--line);border-radius:9px;padding:11px 13px;background:#0e172a;color:var(--text);font:inherit}
button{background:var(--accent);color:#081126;border:0;font-weight:700;cursor:pointer}button.secondary{background:#263653;color:white}
.notice{color:var(--muted);font-size:13px;margin-bottom:16px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px}
.card h3{margin:8px 0;font-size:17px}.meta{color:var(--muted);font-size:12px}.score{float:right;color:#a9c1ff;font-weight:700}
.card p{color:#c4cee2;font-size:13px;line-height:1.5}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.actions a{color:#a9c1ff;text-decoration:none;font-size:13px}
#status{color:var(--muted);padding:10px 0}.modal{margin-top:18px;display:none}.modal textarea{width:100%;min-height:260px;background:#0e172a;color:white;border:1px solid var(--line);border-radius:10px;padding:12px}
@media(max-width:600px){h1{font-size:21px}main{margin:14px auto}.toolbar>*{width:100%}}
</style></head>
<body>
<header><div><h1>🛰️ TrendRadar AI</h1><p>Daily trend discovery · Hinglish dashboard</p></div><div class="meta">Personal Creator Assistant · MVP</div></header>
<main>
<div class="toolbar">
<select id="region"><option value="IN">India</option><option value="US">Worldwide (US signal)</option><option value="GB">UK</option><option value="CA">Canada</option><option value="AU">Australia</option><option value="DE">Germany</option></select>
<button onclick="loadTrends()">Refresh Trends</button><span id="status">Ready</span>
</div>
<div class="notice">Note: Trend score ek indicative heuristic hai, official virality score nahi. Har topic ke source link ko open karke facts verify karein.</div>
<div id="list" class="grid"></div>
<div class="card modal" id="scriptBox"><h2>AI Script Generator</h2>
<p class="meta" id="selectedTopic"></p>
<div class="toolbar"><select id="language"><option>Hinglish</option><option>Hindi</option><option>English</option></select><select id="format"><option>Shorts (60 seconds)</option><option>Long video (5–10 minutes)</option></select><button onclick="generateScript()">Generate Script</button></div>
<div id="scriptStatus" class="meta"></div><textarea id="scriptOutput" placeholder="Generated script yahan dikhegi..."></textarea>
</div>
</main>
<script>
let activeTopic="";
async function loadTrends(){
 const status=document.getElementById('status'), list=document.getElementById('list');
 status.textContent='Trends load ho rahe hain...'; list.innerHTML='';
 try{
  const region=document.getElementById('region').value;
  const res=await fetch('/api/trends?region='+region); const data=await res.json();
  if(!data.trends || !data.trends.length){status.textContent='Abhi feed se topics nahi mile. Thodi der baad refresh karein.';return;}
  status.textContent=data.count+' topics · Updated '+new Date(data.updated_at).toLocaleTimeString();
  data.trends.forEach((t,i)=>{
   const el=document.createElement('article');el.className='card';
   const title=document.createElement('h3');title.textContent=t.title;
   const score=document.createElement('span');score.className='score';score.textContent=t.score+'/100';title.appendChild(score);
   const meta=document.createElement('div');meta.className='meta';meta.textContent=t.source+' · '+(t.published||'Recent feed item');
   const p=document.createElement('p');p.textContent=t.summary||'Is topic ke liye source article open karke details padhein.';
   const actions=document.createElement('div');actions.className='actions';
   const a=document.createElement('a');a.href=t.url;a.target='_blank';a.rel='noopener';a.textContent='Open source ↗';
   const b=document.createElement('button');b.className='secondary';b.textContent='Create video idea';b.onclick=()=>openScript(t.title);
   actions.append(a,b);el.append(title,meta,p,actions);list.appendChild(el);
  });
 }catch(e){status.textContent='Connection error: '+e.message;}
}
function openScript(topic){activeTopic=topic;document.getElementById('selectedTopic').textContent='Topic: '+topic;document.getElementById('scriptBox').style.display='block';document.getElementById('scriptOutput').value='';document.getElementById('scriptBox').scrollIntoView({behavior:'smooth'});}
async function generateScript(){
 const st=document.getElementById('scriptStatus'), out=document.getElementById('scriptOutput');
 st.textContent='AI script generate ho rahi hai...';
 try{
  const r=await fetch('/api/script',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({topic:activeTopic,language:document.getElementById('language').value,format:document.getElementById('format').value})});
  const d=await r.json();
  if(d.script) out.value=d.script;
  else if(d.prompt) out.value='Gemini API key abhi configured nahi hai.\\n\\nRequired prompt:\\n'+d.prompt;
  else out.value=d.error||d.message||'Script generate nahi hui.';
  st.textContent=d.configured?'Complete':'Setup required';
 }catch(e){st.textContent='Error: '+e.message;}
}
loadTrends();
</script></body></html>
